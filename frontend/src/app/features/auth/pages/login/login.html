<div class="w-full max-w-lg px-3 md:px-0">
    <div class="flex flex-col sm:flex-row items-center justify-center my-8 text-center sm:text-left">
        <div>
            <img src="logo-hospitalflow.png" alt="Logo do HospitalFlow" class="w-20 h-20 sm:w-30 sm:h-30 mb-3 sm:mb-0 [-webkit-user-drag:none] select-none">
        </div>

        <div class="px-3">
            <h1 class="text-4xl sm:text-5xl text-[#012059] font-bold">Hospital<span class="text-[#006CD7]">Flow</span></h1>
            <p class="text-gray-500 font-medium text-base sm:text-lg pt-2">Centro de Operações Hospitalares</p>
        </div>
    </div>
    <p-card class="bg-white text-black p-2 mx-1 md:mx-0">
        <form [formGroup]="formulario" (ngSubmit)="entrar()">
            <div class="flex flex-col">
                <label for="email" class="font-bold pb-1">Email</label>
                <p-iconfield>
                    <p-inputicon class="pi pi-envelope" />
                    <input id="email" type="email" class="w-full border-gray-500" pInputText formControlName="email" placeholder="Digite seu email" />
                </p-iconfield>
            </div>

            <div class="flex flex-col pt-4">
                <label for="password" class="font-bold pb-1">Senha</label>
                <p-iconfield>
                    <p-inputicon class="pi pi-lock" />
                    <input id="password" type="password" class="w-full border-gray-500" pInputText formControlName="senha" placeholder="Digite sua senha" />
                </p-iconfield>
            </div>

            <button pButton type="submit" class="mt-7 py-2 w-full bg-[#015ABD] border-[#015ABD] text-white text-lg">Entrar</button>
        </form>

        <hr class="my-5 text-gray-300">

        <div class="flex justify-end text-sm">
            <p>Ainda não tem uma conta? <a href="#">Criar conta</a></p>
        </div>
    </p-card>
</div>
