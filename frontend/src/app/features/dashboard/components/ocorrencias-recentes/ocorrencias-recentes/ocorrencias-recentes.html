<section class="h-full">
    <div class="border rounded-xl border-gray-200 p-4 h-full">
        <div class="flex justify-between mb-5">
            <h1 class="text-xl font-medium">Atendimentos Recentes</h1>
        </div>

        <div class="flex flex-col gap-4">
            
            @for(
                item of atendimentosRecentes();
                track item.id
            ) {
                <div class="flex items-center border-b border-gray-200 pb-4">
                    <div class="me-3">
                        <i class="pi pi-user text-xl bg-[#E5F4FD] text-[#046096] p-2.5 rounded-lg"></i>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between gap-2">
                            <div class="flex flex-wrap items-center gap-2">
                                <h2 class="font-medium">{{ item.paciente_nome }}</h2>
                                <span class="text-xs font-semibold rounded-full px-2 py-0.5" [style.color]="corStatus(item.status)" [class]="backgroundStatus(item.status)">{{ item.status }}</span>
                            </div>
                            <p class="text-gray-500 text-sm whitespace-nowrap">{{ tempoDeEntrada(item.data_entrada) }}</p>
                        </div>

                        <p class="text-gray-500 text-sm">{{ item.setor_nome ?? 'Sem setor' }} • Leito {{ item.leito_codigo ?? 'Sem leito' }}</p>
                    </div>
                </div>
            } @empty {
                <p class="text-gray-500 text-center py-8">
                    Nenhum atendimento recente.
                </p>
            }

        </div>
    </div>
</section>
