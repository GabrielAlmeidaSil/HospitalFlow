<section class="h-full">
    <div class="border rounded-xl border-gray-200 p-4 h-full">
        <div class="flex flex-wrap justify-between items-center gap-3 mb-5">
            <h1 class="text-xl font-medium">Ocupação de Leitos</h1>

            <p-select [options]="periodos" [(ngModel)]="periodoSelecionado" optionLabel="nome" class="w-full sm:w-48" />
        </div>

        <p-chart type="line" [data]="data" [options]="options" class="h-64" />
    </div>
</section>
