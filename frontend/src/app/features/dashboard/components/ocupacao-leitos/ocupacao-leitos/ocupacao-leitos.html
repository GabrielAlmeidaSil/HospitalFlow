<section class="h-full">
    <div class="border rounded-xl border-gray-200 p-4 h-full">
        <div class="flex justify-between mb-2">
            <h1 class="text-xl font-medium">Ocupação por Setor</h1>
        </div>

        <div>
            <div class="py-3 border-b border-gray-200">
                <div class="flex justify-between items-center mb-2">
                    <div>
                        <h2 class="font-medium">UTI</h2>
                        <p class="text-gray-500 text-sm">46 de 50 leitos</p>
                    </div>
                    <p class="bg-[#E4F9F7] text-[#0F966E] text-sm font-semibold rounded-md px-2.5 py-0.5">92%</p>
                </div>
                <p-progressbar [value]="92" [showValue]="false" color="#0F966E" [style]="{ height: '8px' }" />
            </div>

            <div class="py-3 border-b border-gray-200">
                <div class="flex justify-between items-center mb-2">
                    <div>
                        <h2 class="font-medium">Enfermaria</h2>
                        <p class="text-gray-500 text-sm">75 de 110 leitos</p>
                    </div>
                    <p class="bg-[#E4F9F7] text-[#0F966E] text-sm font-semibold rounded-md px-2.5 py-0.5">68%</p>
                </div>
                <p-progressbar [value]="68" [showValue]="false" color="#0F966E" [style]="{ height: '8px' }" />
            </div>

            <div class="py-3 border-b border-gray-200">
                <div class="flex justify-between items-center mb-2">
                    <div>
                        <h2 class="font-medium">Pronto-Socorro</h2>
                        <p class="text-gray-500 text-sm">37 de 50 leitos</p>
                    </div>
                    <p class="bg-[#E4F9F7] text-[#0F966E] text-sm font-semibold rounded-md px-2.5 py-0.5">74%</p>
                </div>
                <p-progressbar [value]="74" [showValue]="false" color="#0F966E" [style]="{ height: '8px' }" />
            </div>

            <div class="pt-3">
                <div class="flex justify-between items-center mb-2">
                    <div>
                        <h2 class="font-medium">Centro Cirúrgico</h2>
                        <p class="text-gray-500 text-sm">24 de 44 leitos</p>
                    </div>
                    <p class="bg-[#E4F9F7] text-[#0F966E] text-sm font-semibold rounded-md px-2.5 py-0.5">55%</p>
                </div>
                <p-progressbar [value]="55" [showValue]="false" color="#0F966E" [style]="{ height: '8px' }" />
            </div>
        </div>
    </div>
</section>
