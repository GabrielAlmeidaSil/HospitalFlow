<section class="h-full">
    <div class="border rounded-xl border-gray-200 p-4 h-full">
        <div class="flex justify-between mb-2">
            <h1 class="text-xl font-medium">Ocupação por Setor</h1>
        </div>

        <div>
            @for (
                setor of ocupacaoSetores();
                track setor.setor_id
            ) {
                <div class="py-3 border-b border-gray-200">
                    <div class="flex justify-between items-center mb-2">
                        <div>
                            <h2 class="font-medium">{{ setor.setor_nome }}</h2>
                            <p class="text-gray-500 text-sm">{{ setor.leitos_ocupados }} de {{ setor.leitos_total }} leitos</p>
                        </div>
                        <p class="bg-[#E4F9F7] text-[#0F966E] text-sm font-semibold rounded-md px-2.5 py-0.5">{{ setor.porcentagem_ocupacao }}%</p>
                    </div>
                    <p-progressbar [value]="setor.porcentagem_ocupacao" [showValue]="false" color="#0F966E" [style]="{ height: '8px' }" />
                </div>
            }
        </div>
    </div>
</section>
