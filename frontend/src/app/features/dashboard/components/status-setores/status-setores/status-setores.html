<section class="h-full">
    <div class="border rounded-xl border-gray-200 p-4 h-full">
        <div class="flex justify-between mb-2">
            <h1 class="text-xl font-medium">Distribuição dos Atendimentos</h1>
        </div>

        <div>
            
            @for (
                item of distribuicao();
                track item.status
            ) {
                <div class="py-3 border-b border-gray-200">
                    <div class="flex items-center gap-3 mb-2">
                        <i class="pi pi-circle-fill text-xs text-[#046096]" [style.color]="corStatus(item.status)"></i>
                        <h2 class="flex-1 font-medium">{{ nomeStatus(item.status) }}</h2>
                        <p class="font-bold text-xl">{{ item.quantidade }}</p>
                        <p class="bg-[#E5F4FD] text-[#046096] text-sm font-semibold rounded-md px-2.5 py-0.5">{{ item.porcentagem_ocupacao }}%</p>
                    </div>
                    <p-progressbar [value]="item.porcentagem_ocupacao" [showValue]="false" [color]="corStatus(item.status)" [class]="classePercentual(item.status)" [style]="{ height: '8px' }" />
                </div>
            }

            @empty {
                <div class="py-8 text-center text-gray-500">
                    Nenhum atendimento em aberto.
                </div>
            }
        </div>
    </div>
</section>
